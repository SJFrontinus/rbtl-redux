<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Between the Lions</title>
<meta property="og:title" content="Read Between the Lions">
<meta property="og:description" content="A reading exercise game.">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* [hidden] must win over author display:flex/grid rules below */
[hidden] { display: none !important; }

:root {
--bg:       #090910;
--surface:  #0f0f18;
--panel:    #13131f;
--border:   #1e1e30;
--muted:    #35354a;
--dim:      #55556a;
--text:     #ccc8be;
--accent:   #e8e060;
--green:    #38e87a;
--yellow:   #f0b840;
--red:      #e05050;
--green-glow: rgba(56,232,122,0.45);
--yellow-glow: rgba(240,184,64,0.4);
}

body {
background: var(--bg);
color: var(--text);
font-family: 'Space Mono', monospace;
min-height: 100vh;
padding: 28px 18px 60px;
display: flex;
flex-direction: column;
align-items: center;
gap: 22px;
}

/* ─── Header ─── */
header {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
h1 {
font-family: 'Syne', sans-serif;
font-weight: 800;
font-size: 1.25rem;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--accent);
}
.subtitle {
font-size: 0.6rem;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(--dim);
}

/* ─── Controls row ─── */
.controls {
display: flex;
gap: 18px;
align-items: flex-start;
justify-content: center;
flex-wrap: wrap;
width: 100%;
max-width: 860px;
background: var(--panel);
border: 1px solid var(--border);
border-radius: 10px;
padding: 18px 22px;
}

/* ─── Ticks control ─── */
.ticks-group {
display: flex;
flex-direction: column;
align-items: center;
gap: 6px;
}
.ticks-group label {
font-size: 0.58rem;
letter-spacing: 0.16em;
text-transform: uppercase;
color: var(--dim);
}
input[type=range] {
-webkit-appearance: none;
appearance: none;
width: 100px;
height: 4px;
background: var(--muted);
border-radius: 2px;
outline: none;
cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
width: 14px; height: 14px;
background: var(--accent);
border-radius: 50%;
}
.ticks-val, .val-input {
font-family: 'Space Mono', monospace;
font-size: 0.9rem;
font-weight: 700;
color: var(--accent);
}
.val-input {
background: transparent;
border: none;
border-bottom: 1px solid var(--muted);
text-align: center;
width: 6ch;
outline: none;
padding: 0 2px;
-moz-appearance: textfield;
}
.val-input::-webkit-outer-spin-button,
.val-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.val-input:focus { border-bottom-color: var(--accent); background: rgba(232,224,96,0.06); border-radius: 2px 2px 0 0; }
.readout-row {
display: flex;
align-items: baseline;
gap: 3px;
justify-content: center;
}
.val-unit {
font-size: 0.68rem;
color: var(--dim);
}
.val-sub {
font-size: 0.62rem;
color: var(--dim);
text-align: center;
}
select#text-select {
font-family: 'Space Mono', monospace;
font-size: 0.62rem;
color: var(--accent);
background: var(--surface);
border: 1px solid var(--muted);
border-radius: 5px;
padding: 6px 8px;
cursor: pointer;
max-width: 160px;
}

/* ─── Buttons ─── */
.btn-group {
display: flex;
flex-direction: column;
gap: 7px;
padding-top: 22px;
}
.btn {
font-family: 'Space Mono', monospace;
font-size: 0.7rem;
font-weight: 700;
letter-spacing: 0.08em;
border: none;
border-radius: 5px;
padding: 8px 18px;
cursor: pointer;
transition: opacity 0.12s, transform 0.08s;
}
.btn:hover  { opacity: 0.85; }
.btn:active { transform: scale(0.96); }
.btn-play  { background: var(--green);  color: #060c10; }
.btn-stop  { background: var(--red);    color: #fff; }
.btn-reset { background: transparent; border: 1px solid var(--muted); color: var(--dim); }

/* ─── Divider ─── */
.ctrl-divider {
width: 1px;
align-self: stretch;
background: var(--border);
margin: 0 2px;
}

/* ─── Lights ─── */
.lights-section {
width: 100%;
/* Grow with the viewport so the tick columns can spread toward the
   edges in landscape / fullscreen, while staying readable on phones. */
max-width: min(1280px, 94vw);
background: var(--panel);
border: 1px solid var(--border);
border-radius: 8px;
padding: 14px clamp(18px, 4vw, 56px) 18px;
}
.section-label {
font-size: 0.58rem;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(--dim);
margin-bottom: 12px;
}
#lights-container {
display: grid;
grid-template-columns: 1fr 1fr;
grid-template-rows: repeat(10, auto);
gap: 14px 0;
/* Fill the panel: the left/right columns push to the panel edges, so the
   gap between them widens as the window grows. */
width: 100%;
margin: 0 auto;
}
.light-wrap {
display: flex;
align-items: center;
gap: 10px;
}
.light-wrap.left {
justify-self: start;
flex-direction: row;
padding-left: 20px;
}
.light-wrap.right {
justify-self: end;
flex-direction: row-reverse;
padding-right: 20px;
}
.light {
width: 28px;
height: 28px;
border-radius: 50%;
border: 1px solid var(--border);
transition: background 0.05s ease, box-shadow 0.05s ease;
flex-shrink: 0;
}
.light.dark   { background: #1a1a2e; border-color: #2a2a42; box-shadow: none; }
.light.green  { background: var(--green);  border-color: var(--green);  box-shadow: 0 0 12px var(--green-glow); }
.light.yellow { background: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 10px var(--yellow-glow); }
.light.red    { background: var(--red);    border-color: var(--red);    box-shadow: 0 0 10px rgba(224,80,80,0.4); }
.light-num {
font-size: 0.7rem;
color: var(--muted);
line-height: 1;
font-weight: 700;
}


/* ─── Exercise chooser ─── */
.chooser {
  display: flex;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px;
}
.chooser-btn {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  background: transparent;
  border: none;
  border-radius: 5px;
  padding: 8px 16px;
  cursor: pointer;
  transition: color 0.12s, background 0.12s;
}
.chooser-btn:hover { color: var(--text); }
.chooser-btn.active {
  color: #060c10;
  background: var(--accent);
}

/* ─── RBTL reading pane ─── */
#rbtl-pane {
  margin: 0 auto;
  max-width: 100%;
  font-family: 'Space Mono', monospace;
  line-height: 1.9;
  color: var(--text);
  text-align: left;
}
#rbtl-pane p { margin: 0 0 1em; }
#rbtl-pane.empty::before {
  content: 'Load a passage to begin — SAMPLE or LOAD .TXT.';
  color: var(--dim);
  font-size: 0.8rem;
}
.rbtl-word {
  border-radius: 4px;
  padding: 0 2px;
  transition: background 0.05s ease, color 0.05s ease, box-shadow 0.05s ease;
}
.rbtl-word.yellow { background: var(--yellow); color: #1a1205; box-shadow: 0 0 8px var(--yellow-glow); }
.rbtl-word.green  { background: var(--green);  color: #042012; box-shadow: 0 0 8px var(--green-glow); }
.rbtl-word.red    { background: var(--red);    color: #fff; }

/* status bar */
.status-bar {
font-size: 0.6rem;
color: var(--dim);
letter-spacing: 0.1em;
text-transform: uppercase;
margin-top: 8px;
text-align: right;
padding-right: 2px;
}
.status-bar span { color: var(--accent); }

/* ─── In-play control bar ─── */
.playbar {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin: 0 auto 14px;
  padding: 10px;
  max-width: 1100px;
}
.playbar .btn { min-width: 120px; }
.playbar #pb-toggle.resume { background: var(--green); color: #060c10; }
.playbar #pb-toggle.done   { background: var(--muted); color: var(--dim); cursor: default; }

/* While a run is active, collapse the whole setup area for more target room. */
body.playing header,
body.playing .chooser,
body.playing .controls { display: none; }
body:not(.playing) .playbar { display: none; }
</style>

</head>
<body>

<header>
  <h1 id="app-title">Read Between the Lions</h1>
  <div class="subtitle" id="app-subtitle">Paced eye-movement reading drills</div>
</header>

<!-- Exercise chooser -->

<div class="chooser">
  <button class="chooser-btn active" id="choose-dots" data-exercise="dots">Dots</button>
  <button class="chooser-btn"        id="choose-rbtl" data-exercise="rbtl">Text</button>
</div>

<!-- In-play control bar (shown only while running) -->

<div class="playbar">
  <button class="btn btn-stop"  id="pb-toggle">■ STOP</button>
  <button class="btn btn-reset" id="pb-reset">↺ RESET</button>
  <button class="btn btn-reset" id="pb-config">⚙ CONFIG</button>
</div>

<!-- Controls -->

<div class="controls">

  <div class="ticks-group">
    <label for="speed-slider">Speed (t/s)</label>
    <input type="range" id="speed-slider" min="0.5" max="4" step="0.1" value="2">
    <div class="readout-row">
      <input type="number" id="speed-num" class="val-input" min="0.5" max="4" step="0.1" value="2">
      <span class="val-unit">t/s</span>
    </div>
    <div class="val-sub" id="speed-ms">500.0 ms/tick</div>
  </div>

  <div class="ctrl-divider"></div>

  <div class="ticks-group">
    <label for="offset-slider">Offset (early)</label>
    <input type="range" id="offset-slider" min="0" max="100" step="0.5" value="2">
    <div class="readout-row">
      <input type="number" id="offset-num" class="val-input" min="0" max="100" step="0.5" value="2">
      <span class="val-unit">%</span>
    </div>
    <div class="val-sub" id="offset-ms">0.00 ms</div>
  </div>

  <!-- Dots-only controls -->
  <div class="ctrl-divider exer-dots"></div>
  <div class="ticks-group exer-dots" id="ticks-group">
    <label for="ticks-slider">Tick Count</label>
    <input type="range" id="ticks-slider" min="5" max="40" value="20">
    <input type="number" class="val-input ticks-val" id="ticks-val" min="5" max="40" value="20">
  </div>

  <!-- RBTL-only controls -->
  <div class="ctrl-divider exer-rbtl" hidden></div>
  <div class="ticks-group exer-rbtl" hidden>
    <label for="font-slider">Font Size</label>
    <input type="range" id="font-slider" min="14" max="42" value="22">
    <input type="number" class="val-input ticks-val" id="font-val" min="14" max="42" value="22">
  </div>
  <div class="ctrl-divider exer-rbtl" hidden></div>
  <div class="ticks-group exer-rbtl" hidden>
    <label for="width-slider">Column Width</label>
    <input type="range" id="width-slider" min="320" max="900" value="600">
    <input type="number" class="val-input ticks-val" id="width-val" min="320" max="900" value="600">
  </div>
  <div class="ctrl-divider exer-rbtl" hidden></div>
  <div class="ticks-group exer-rbtl" hidden>
    <label for="lines-slider">Max Lines</label>
    <input type="range" id="lines-slider" min="4" max="120" value="20">
    <input type="number" class="val-input ticks-val" id="lines-val" min="4" max="120" value="20">
  </div>
  <div class="ctrl-divider exer-rbtl" hidden></div>
  <div class="ticks-group exer-rbtl" hidden>
    <label for="linespp-slider">Lines / Page</label>
    <input type="range" id="linespp-slider" min="1" max="40" value="8">
    <input type="number" class="val-input ticks-val" id="linespp-val" min="1" max="40" value="8">
  </div>
  <div class="ctrl-divider exer-rbtl" hidden></div>
  <div class="ticks-group exer-rbtl" hidden>
    <label for="text-select">Passage</label>
    <select id="text-select"></select>
  </div>
  <div class="ctrl-divider exer-rbtl" hidden></div>
  <div class="btn-group exer-rbtl" hidden>
    <label class="btn btn-reset" for="file-input" style="text-align:center; cursor:pointer;">📄 LOAD .TXT</label>
    <input type="file" id="file-input" accept=".txt,text/plain" hidden>
    <button class="btn btn-reset" id="debug-toggle" style="margin-top:6px;">🐞 DEBUG: OFF</button>
  </div>

  <div class="ctrl-divider"></div>

  <div class="btn-group">
    <button class="btn btn-play"  id="btn-play">▶ PLAY</button>
    <button class="btn btn-stop"  id="btn-stop">■ STOP</button>
    <button class="btn btn-reset" id="btn-reset">↺ RESET</button>
  </div>

</div>

<!-- Dots target area -->

<div class="lights-section exer-dots" id="lights-section">
  <div class="section-label">Tick Lights</div>
  <div id="lights-container"></div>
  <div class="status-bar" id="status-bar">stopped</div>
</div>

<!-- RBTL reading pane -->

<div class="lights-section exer-rbtl" id="rbtl-section" hidden>
  <div class="section-label">Read Between the Lions</div>
  <div id="rbtl-pane"></div>
  <div class="status-bar" id="rbtl-status">stopped</div>
</div>


<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════

let audioCtx      = null;
let isPlaying     = false;
let isPaused      = false;
let startAudioT   = 0;
let schedTick     = 0;
let schedTimer    = null;
let lightTimeouts = [];
let lightStates   = [];
let lightHits     = [];  // true if user clicked while yellow

let ticksPerSec   = 4;    // overridden by setSpeed() at init
let totalTicks    = 20;
let offsetFrac    = 0.02; // 0..1 (fraction of tick interval); default ~10ms at 2 t/s

// The engine drives an abstract target source. An "exercise" adapter maps the
// engine's per-target state to concrete DOM (dots or words). Set in init().
let activeExercise = null;

// Derived
const tickSec   = () => 1 / ticksPerSec;
const tickMs    = () => tickSec() * 1000;
const offsetSec = () => offsetFrac * tickSec();
const offsetMs  = () => offsetFrac * tickMs();

// ═══════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════

function ensureCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function scheduleClick(time, isCountdown) {
  if (isCountdown) { scheduleLeadIn(time); return; }
  scheduleTick(time);
}

// Metronome tick — a sharp, bright woodblock click (the running beat).
function scheduleTick(time) {
  const ac   = ensureCtx();
  const freq = 900;
  const vol  = 0.5;

  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, time);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, time + 0.06);

  const env = ac.createGain();
  env.gain.setValueAtTime(vol, time);
  env.gain.exponentialRampToValueAtTime(0.001, time + 0.08);

  // Second harmonic for woodblock character
  const osc2 = ac.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2.4, time);
  osc2.frequency.exponentialRampToValueAtTime(freq * 1.2, time + 0.04);

  const env2 = ac.createGain();
  env2.gain.setValueAtTime(vol * 0.35, time);
  env2.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

  osc.connect(env);
  osc2.connect(env2);
  env.connect(ac.destination);
  env2.connect(ac.destination);

  osc.start(time);
  osc.stop(time + 0.1);
  osc2.start(time);
  osc2.stop(time + 0.06);
}

// Lead-in / countdown — a soft, sustained low triangle "bloop": a deliberately
// different timbre and attack from the sharp tick, so the 3-2-1 (at the start
// and at every page break) never sounds like the running metronome.
function scheduleLeadIn(time) {
  const ac   = ensureCtx();
  const freq = 330;          // low, warm
  const vol  = 0.32;

  const osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, time);

  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, time);
  env.gain.exponentialRampToValueAtTime(vol, time + 0.02);  // soft attack
  env.gain.exponentialRampToValueAtTime(0.0001, time + 0.30); // long decay

  // gentle low-pass to round it off
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1200, time);

  osc.connect(lp);
  lp.connect(env);
  env.connect(ac.destination);

  osc.start(time);
  osc.stop(time + 0.34);
}

// ═══════════════════════════════════════════════════════
//  SCHEDULER  (Web Audio lookahead pattern)
// ═══════════════════════════════════════════════════════

const LOOKAHEAD = 0.12; // seconds
const SCHED_MS  = 25;   // polling interval
const COUNTDOWN = 3;    // 3-2-1 countdown beats
const PAGE_PAUSE_MS = 1200; // pause between pages before the next lead-in

// countdownStartT is when countdown beat 0 (the "3") fires
let countdownStartT = 0;
let curPage = 0;        // current page index within a run

function scheduleCountdownBeat(beat) {
  // beat 0 = "3", beat 1 = "2", beat 2 = "1"
  const ac   = ensureCtx();
  const time = countdownStartT + beat * tickSec();
  scheduleClick(time, true);

  const label = 3 - beat; // 3, 2, 1
  const delay = Math.max(0, (time - ac.currentTime) * 1000);
  const t = setTimeout(() => {
    setStatus(`countdown: ${label}`);
  }, delay);
  lightTimeouts.push(t);
}

function scheduleTickN(n) {
  const ac       = ensureCtx();
  const count    = activeExercise.targetCount();
  const tickTime = startAudioT + n * tickSec();

  // Audio click on actual tick
  scheduleClick(tickTime, false);

  // Target turns yellow offsetSec() BEFORE the tick sound (anticipation window)
  const greenT     = tickTime - offsetSec();
  const greenDelay = Math.max(0, (greenT - ac.currentTime) * 1000);

  const t1 = setTimeout(() => {
    // Previous target: green if hit, red if missed
    if (n > 0 && lightStates[n - 1] === 'yellow') {
      lightStates[n - 1] = lightHits[n - 1] ? 'green' : 'red';
      activeExercise.paint(n - 1, lightStates[n - 1]);
    }
    lightStates[n] = 'yellow';
    activeExercise.paint(n, 'yellow');
    setStatus(`target ${n + 1} / ${count}`);
  }, greenDelay);
  lightTimeouts.push(t1);

  // For the last target on this page: keep yellow for one full tick interval
  // (phantom tick), then resolve hit/miss and either advance to the next page
  // (with a fresh lead-in) or finish the run.
  if (n === count - 1) {
    const phantomGreenT = tickTime + tickSec() - offsetSec();
    const phantomDelay  = Math.max(0, (phantomGreenT - ac.currentTime) * 1000);
    const pages = activeExercise.pageCount();

    const t2 = setTimeout(() => {
      lightStates[n] = lightHits[n] ? 'green' : 'red';
      activeExercise.paint(n, lightStates[n]);

      if (curPage + 1 < pages) {
        setStatus(`page ${curPage + 1}/${pages} done — next…`);
        const adv = setTimeout(() => { curPage++; startPage(curPage); }, PAGE_PAUSE_MS);
        lightTimeouts.push(adv);
      } else {
        isPlaying = false;
        setToggle('done');
        setStatus('done');
      }
    }, phantomDelay);
    lightTimeouts.push(t2);
  }
}

function schedulerLoop() {
  const ac = ensureCtx();

  // Schedule countdown beats
  while (
    schedCountdown < COUNTDOWN &&
    countdownStartT + schedCountdown * tickSec() < ac.currentTime + LOOKAHEAD
  ) {
    scheduleCountdownBeat(schedCountdown);
    schedCountdown++;
  }

  // Schedule tick beats — use the yellow-on time (earliest event per tick)
  const count = activeExercise.targetCount();
  while (
    schedTick < count &&
    (startAudioT + schedTick * tickSec() - offsetSec()) < ac.currentTime + LOOKAHEAD
  ) {
    scheduleTickN(schedTick);
    schedTick++;
  }

  if (schedTick < count) {
    schedTimer = setTimeout(schedulerLoop, SCHED_MS);
  }
}

let schedCountdown = 0;

// ═══════════════════════════════════════════════════════
//  TRANSPORT
// ═══════════════════════════════════════════════════════

// Toggle button (Stop ↔ Resume ↔ done) on the in-play bar.
function setToggle(mode) {
  const b = document.getElementById('pb-toggle');
  if (!b) return;
  b.classList.remove('resume', 'done');
  if (mode === 'resume')   { b.textContent = '▶ RESUME'; b.classList.add('resume'); }
  else if (mode === 'done'){ b.textContent = '✓ DONE';   b.classList.add('done'); }
  else                     { b.textContent = '■ STOP'; }
}

function enterPlayMode() { document.body.classList.add('playing'); }
function exitPlayMode()  { document.body.classList.remove('playing'); }

function play() {
  if (isPlaying) return;

  // Collapse the setup area first so the layout measures the expanded pane.
  enterPlayMode();

  // Freeze layout + paginate the run; abort (and restore config) if nothing to drive.
  if (activeExercise.layoutPages && !activeExercise.layoutPages()) {
    exitPlayMode();
    setStatus('no targets');
    return;
  }
  if (activeExercise.pageCount() < 1) { exitPlayMode(); setStatus('no targets'); return; }

  const ac = ensureCtx();
  if (ac.state === 'suspended') ac.resume();

  isPlaying = true;
  isPaused  = false;
  curPage   = 0;
  clearAllTimeouts();
  setToggle('stop');
  startPage(0);
}

// Pause: halt the scheduler, freeze the current colors. (Audio clicks already
// queued within the lookahead may still sound — acceptable.)
function pauseRun() {
  if (!isPlaying || isPaused) return;
  clearTimeout(schedTimer);
  clearAllTimeouts();
  isPaused = true;
  setToggle('resume');
  setStatus('paused');
}

// Resume: instant go from the first unresolved target on the current page —
// re-anchor the timeline so it fires immediately, skipping the 3-2-1 count-in.
function resumeRun() {
  if (!isPlaying || !isPaused) return;
  const ac = ensureCtx();
  if (ac.state === 'suspended') ac.resume();

  let k = lightStates.findIndex(s => s === 'yellow' || s === 'dark');
  if (k < 0) return;  // page already fully resolved; nothing to resume

  startAudioT     = ac.currentTime + 0.03 - k * tickSec() + offsetSec();
  schedTick       = k;
  schedCountdown  = COUNTDOWN;  // no count-in on resume
  isPaused        = false;
  setToggle('stop');
  setStatus(`target ${k + 1} / ${lightStates.length}`);
  schedulerLoop();
}

// Reset (in-play): restart the whole run from page 1 with freshly rolled targets.
function restartRun() {
  clearTimeout(schedTimer);
  clearAllTimeouts();
  const ac = ensureCtx();
  if (ac.state === 'suspended') ac.resume();
  isPlaying = true;
  isPaused  = false;
  curPage   = 0;
  setToggle('stop');
  startPage(0);
}

// Config: leave the run and restore the setup area with its idle preview.
function exitToConfig() {
  clearTimeout(schedTimer);
  clearAllTimeouts();
  isPlaying = false;
  isPaused  = false;
  exitPlayMode();
  if (activeExercise.resetLayout) activeExercise.resetLayout();
  lightStates = new Array(activeExercise.targetCount()).fill('dark');
  setStatus('ready');
}

// Run one page: prepare its targets, then schedule its lead-in + ticks. Each
// page anchors to a fresh audioCtx.currentTime so the lead-in re-runs per page.
function startPage(p) {
  const ac = ensureCtx();
  activeExercise.beginPage(p);
  const count = activeExercise.targetCount();

  schedTick      = 0;
  schedCountdown = 0;
  lightStates    = new Array(count).fill('dark');
  lightHits      = new Array(count).fill(false);
  renderTargets();

  // Timeline:
  //   countdownStartT ----3 beats---- startAudioT (tick 0 sound)
  //   First target yellow = startAudioT - offsetSec()
  countdownStartT = ac.currentTime + 0.06;
  startAudioT     = countdownStartT + COUNTDOWN * tickSec();

  const pages = activeExercise.pageCount();
  setStatus(pages > 1 ? `page ${p + 1}/${pages} — countdown: 3` : 'countdown: 3');

  schedulerLoop();
}

function stop() {
  isPlaying = false;
  clearTimeout(schedTimer);
  clearAllTimeouts();
  setStatus('stopped');
}

function reset() {
  stop();
  // resetLayout owns the idle visual (dots → dark; RBTL → re-render preview).
  if (activeExercise.resetLayout) activeExercise.resetLayout();
  lightStates = new Array(activeExercise.targetCount()).fill('dark');
  setStatus('ready');
}

function clearAllTimeouts() {
  lightTimeouts.forEach(clearTimeout);
  lightTimeouts = [];
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════

// Repaint every target for the active exercise from the generic state array.
function renderTargets() {
  const n = activeExercise.targetCount();
  for (let i = 0; i < n; i++) {
    activeExercise.paint(i, lightStates[i] || 'dark');
  }
}

// Lights row — zigzag: odd ticks left column, even ticks right column
// Position map: each entry is { col: 'left'|'right', row: 0-based }
let lightPositions = [];

function buildLights() {
  const c = document.getElementById('lights-container');
  c.innerHTML = '';
  lightPositions = [];
  const rows = Math.ceil(totalTicks / 2);
  c.style.gridTemplateRows = `repeat(${rows}, auto)`;

  for (let i = 0; i < totalTicks; i++) {
    const col = (i % 2 === 0) ? 'left' : 'right';
    const row = Math.floor(i / 2);
    lightPositions.push({ col, row });

    const w = document.createElement('div');
    w.className = `light-wrap ${col}`;
    w.style.gridRow = row + 1;
    w.style.gridColumn = col === 'left' ? 1 : 2;
    w.innerHTML = `<div id="light-${i}" class="light dark"></div>
                   <div class="light-num">${i + 1}</div>`;
    c.appendChild(w);
  }
}

//  Each maps the engine's generic per-target state onto concrete DOM.

const dotExercise = {
  statusId: 'status-bar',
  targetCount() { return totalTicks; },
  pageCount()   { return 1; },
  layoutPages() { return totalTicks > 0; },
  beginPage()   { buildLights(); },
  buildLayout()  { buildLights(); },
  resetLayout()  { for (let i = 0; i < totalTicks; i++) this.paint(i, 'dark'); },
  paint(i, state) {
    const el = document.getElementById(`light-${i}`);
    if (el) el.className = `light ${state}`;
  },
  getTargetEl(i) { return document.getElementById(`light-${i}`); },
  hitRadius()    { return 80; },
};

// Bundled sample passage (works from file:// — no fetch). Paragraphs are
// separated by blank lines, matching the .txt convention.
const RBTL_SAMPLE = `Atherogenicity of Lipoprotein(a) Versus LDL: A Comprehensive Analysis

Lipoprotein(a) and low-density lipoprotein both contribute to atherosclerotic cardiovascular disease, yet Lp(a) is substantially more atherogenic on a per-particle basis. This distinction has critical implications for cardiovascular risk assessment and clinical management. Recent Mendelian randomization analyses and mechanistic studies reveal fundamental differences in how these lipoproteins drive vascular pathology.

The most striking difference between Lp(a) and LDL is their relative atherogenic potency when compared particle-for-particle. Since both lipoproteins contain exactly one apoB molecule per particle, researchers can use apoB as a direct quantitative comparator. Mendelian randomization studies leveraging genome-wide association data from over five hundred thousand participants demonstrate that Lp(a) is roughly six to seven times more atherogenic than LDL on an equimolar basis.

This heightened per-particle risk translates to meaningful clinical implications. However, since circulating Lp(a) particle concentrations are typically far lower than LDL particle concentrations, even in individuals with markedly elevated Lp(a), the absolute contribution to total apoB-containing particles remains limited. On a population level, LDL particles, which vastly outnumber Lp(a) particles, account for greater absolute cardiovascular burden in most individuals.`;

// Kid-friendly bundled passages (original text). Short sentences make clean
// visual lines for new readers.
const RBTL_STORY_FOX = `The Little Fox and the Bright Moon

One quiet night a little fox crept out of her den. The moon was big and round and bright. The fox looked up and thought it was a ball of cheese in the sky. She wanted a taste of it very much.

She ran across the field as fast as she could. She jumped over a log and splashed through a stream. But the moon stayed far away, high above the trees. No matter how fast she ran, she could not reach it.

At last the little fox sat down to rest. A wise old owl landed on a branch nearby. The owl said the moon is not for eating. It is a light for everyone to share. The fox smiled, and the two friends watched the moon together until morning.`;

const RBTL_STORY_GARDEN = `The Seed That Would Not Wait

A small boy planted one tiny seed in a pot of soft brown soil. He gave it water and set it by the window. Then he waited and waited for it to grow.

Every morning he checked the pot. He saw only dirt. He tapped the soil and called to the seed. Wake up, little seed, he said. But nothing happened at all.

The boy felt sad and almost gave up hope. His mother told him that good things take time. So he kept watering the pot each day. One bright morning a tiny green leaf pushed up through the soil. The boy clapped his hands with joy. His patience had grown a plant.`;

// Library of bundled passages, shown in the Passage dropdown.
const RBTL_TEXTS = [
  { name: 'The Little Fox (easy)', text: RBTL_STORY_FOX },
  { name: 'The Seed (easy)',       text: RBTL_STORY_GARDEN },
  { name: 'Lp(a) vs LDL (hard)',   text: RBTL_SAMPLE },
];

let rbtlText    = '';
let rbtlTargets = [];   // current page's chosen word spans, reading order
let rbtlFontPx  = 22;
let rbtlColW    = 600;
let rbtlMaxLines = 20;     // hard cap on total visual lines used from the passage
let rbtlLinesPerPage = 8;  // requested pagination chunk (clamped to what fits)
let rbtlDebug    = false;  // setup-only: reveal page-0 targets in yellow when true

// Pagination state (computed by computeRbtlLayout)
let rbtlLines     = [];  // array of visual lines; each is an array of word spans
let rbtlLineH     = 0;   // px stride of one visual line (tight, intra-paragraph)
let rbtlLineTops  = [];  // content-relative top px of each visual line (stable @ scrollTop 0)
let rbtlContentBottom = 0; // content-relative bottom px of the last line
let rbtlMidX      = 0;   // viewport x of the column's horizontal midpoint
let rbtlTitleLineIdx  = -1; // index of the heading line (no targets), or -1
let rbtlPerPage   = 0;   // visual lines per page
let rbtlPageCount = 0;

function rbtlPane() { return document.getElementById('rbtl-pane'); }

// Lay out the text into measurable word spans at the current font/width.
function buildRbtlSpans() {
  const pane = rbtlPane();
  pane.style.fontSize = rbtlFontPx + 'px';
  pane.style.width    = rbtlColW + 'px';
  pane.style.height   = 'auto';
  pane.style.overflow = 'visible';
  pane.scrollTop      = 0;
  pane.innerHTML = '';
  rbtlTargets = [];

  if (!rbtlText) { pane.classList.add('empty'); return; }
  pane.classList.remove('empty');

  const paras = rbtlText.split(/\n\s*\n/);
  let firstPara = true;
  for (const para of paras) {
    const text = para.replace(/\s+/g, ' ').trim();
    if (!text) continue;
    const p = document.createElement('p');
    if (firstPara) { p.classList.add('rbtl-heading'); firstPara = false; }
    const words = text.split(' ');
    words.forEach((word, idx) => {
      const span = document.createElement('span');
      span.className = 'rbtl-word';
      span.textContent = word;
      p.appendChild(span);
      if (idx < words.length - 1) p.appendChild(document.createTextNode(' '));
    });
    pane.appendChild(p);
  }
}

// Group word spans into visual lines by vertical position (must be called while
// the pane is at full height / not clipped).
function detectLines() {
  const spans = Array.from(document.querySelectorAll('.rbtl-word'));
  const lines = [];
  let curTop = null, cur = null;
  for (const s of spans) {
    const top = Math.round(s.getBoundingClientRect().top);
    if (curTop === null || Math.abs(top - curTop) > 4) {
      cur = []; lines.push(cur); curTop = top;
    }
    cur.push(s);
  }
  return lines;
}

// Remove every node at/after the first span of the first excluded line, so the
// DOM holds exactly rbtlMaxLines visual lines.
function truncateAfterLine(lines, maxLines) {
  if (lines.length <= maxLines) return;
  const cutoff = lines[maxLines][0];
  const para   = cutoff.parentElement;
  let node = cutoff;
  while (node) { const next = node.nextSibling; node.remove(); node = next; }
  let p = para.nextElementSibling;
  while (p) { const n = p.nextElementSibling; p.remove(); p = n; }
}

// Detect lines, cap to rbtlMaxLines, then paginate by the requested chunk
// (clamped to what physically fits the visible pane).
function computeRbtlLayout() {
  const pane = rbtlPane();
  let lines = detectLines();
  if (lines.length > rbtlMaxLines) {
    truncateAfterLine(lines, rbtlMaxLines);
    lines = detectLines();
  }
  rbtlLines = lines;

  // Heading: treat the first paragraph as a title (no targets) only when it
  // occupies a single visual line, so a title-less wrapping first paragraph
  // isn't wrongly skipped.
  rbtlTitleLineIdx = -1;
  if (lines.length) {
    const firstP = lines[0][0].parentElement;
    if (lines.length < 2 || lines[1][0].parentElement !== firstP) rbtlTitleLineIdx = 0;
  }

  // Capture stable content-relative geometry while the pane is unclipped
  // (buildRbtlSpans leaves it height:auto, scrollTop 0).
  const paneRect = pane.getBoundingClientRect();
  const paneTop = paneRect.top;
  rbtlMidX = paneRect.left + paneRect.width / 2;  // column horizontal midpoint
  rbtlLineTops = lines.map(ln => ln[0].getBoundingClientRect().top - paneTop);
  rbtlContentBottom = lines.length
    ? Math.max(...lines[lines.length - 1].map(s => s.getBoundingClientRect().bottom)) - paneTop
    : 0;

  // Tight single-line stride = smallest positive gap (paragraph breaks are larger).
  let stride = Infinity;
  for (let i = 1; i < rbtlLineTops.length; i++) {
    const d = rbtlLineTops[i] - rbtlLineTops[i - 1];
    if (d > 0 && d < stride) stride = d;
  }
  rbtlLineH = isFinite(stride) ? stride : rbtlFontPx * 1.5;

  // Chunk = requested Lines/Page, clamped to what fits the visible pane. Play
  // mode hides the setup area, so more vertical room is available then.
  const playing = document.body.classList.contains('playing');
  const budget = Math.max(150, window.innerHeight * (playing ? 0.85 : 0.5) - 24);
  const viewportFit = Math.max(1, Math.floor(budget / rbtlLineH));
  rbtlPerPage = Math.max(1, Math.min(rbtlLinesPerPage, viewportFit, lines.length || 1));
  rbtlPageCount = lines.length ? Math.ceil(lines.length / rbtlPerPage) : 0;

  if (rbtlPageCount <= 1) {
    pane.style.height = 'auto';
    pane.style.overflow = 'visible';
  } else {
    // Fixed clip height = tallest page (by real line tops), so no page is cut
    // and the pane doesn't jump between pages.
    let clipH = 0;
    for (let p = 0; p < rbtlPageCount; p++) {
      const s = p * rbtlPerPage;
      const e = Math.min(s + rbtlPerPage, lines.length);
      const h = (e < lines.length ? rbtlLineTops[e] : rbtlContentBottom) - rbtlLineTops[s];
      if (h > clipH) clipH = h;
    }
    pane.style.height = clipH + 'px';
    pane.style.overflow = 'hidden';
    // A short final page is shorter than clipH; without extra scroll room the
    // browser clamps scrollTop and earlier (untargeted) lines bleed in at the
    // top. A bottom spacer extends scrollHeight so every page's first line can
    // reach the top. (A child element is box-sizing-safe, unlike padding.)
    const spacer = document.createElement('div');
    spacer.className = 'rbtl-spacer';
    spacer.setAttribute('aria-hidden', 'true');
    spacer.style.height = clipH + 'px';
    pane.appendChild(spacer);
  }
}

// Targets are split by horizontal position, not word index: one word from the
// left half of the column and one from the right half. A short line whose text
// never reaches the right half (e.g. a paragraph's last line) gets a single
// target — no second target is placed in the left half. The heading line gets
// no targets.
function pickPageTargets(p) {
  const start = p * rbtlPerPage;
  const end   = Math.min(start + rbtlPerPage, rbtlLines.length);
  const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
  const centerX = s => { const r = s.getBoundingClientRect(); return r.left + r.width / 2; };
  const targets = [];
  for (let li = start; li < end; li++) {
    if (li === rbtlTitleLineIdx) continue;
    const line = rbtlLines[li];
    const leftWords = [], rightWords = [];
    for (const s of line) (centerX(s) < rbtlMidX ? leftWords : rightWords).push(s);
    if (rightWords.length === 0) {
      // Line stays in the left half — a single target only.
      targets.push(pick(leftWords.length ? leftWords : line));
    } else if (leftWords.length === 0) {
      targets.push(pick(rightWords));
    } else {
      targets.push(pick(leftWords), pick(rightWords));
    }
  }
  return targets;
}

function clearRbtlHighlights() {
  document.querySelectorAll('.rbtl-word').forEach(el =>
    el.classList.remove('yellow', 'green', 'red'));
}

// Scroll to page p, re-roll its targets into rbtlTargets, optionally preview them.
function showPage(p, highlight) {
  const start = p * rbtlPerPage;
  rbtlPane().scrollTop = rbtlLineTops[start] || 0;
  rbtlTargets = pickPageTargets(p);
  if (highlight) {
    clearRbtlHighlights();
    rbtlTargets.forEach(el => el.classList.add('yellow'));
  }
}

// Idle render: lay out, paginate; preview page 0's targets only in Debug mode.
function renderRbtl() {
  buildRbtlSpans();
  if (!rbtlText) { rbtlTargets = []; rbtlLines = []; rbtlPageCount = 0; return; }
  computeRbtlLayout();
  showPage(0, rbtlDebug);
}

const rbtlExercise = {
  statusId: 'rbtl-status',
  targetCount() { return rbtlTargets.length; },
  pageCount()   { return rbtlPageCount; },
  buildLayout() { renderRbtl(); },
  resetLayout() { renderRbtl(); },
  // Freeze layout + paginate for this run (re-roll happens per page in beginPage).
  layoutPages() {
    buildRbtlSpans();
    if (!rbtlText) return false;
    computeRbtlLayout();
    return rbtlLines.length > 0;
  },
  // Make page p the active page: scroll to it, pick its targets, start dark.
  beginPage(p) {
    showPage(p, false);
    clearRbtlHighlights();
  },
  paint(i, state) {
    const el = rbtlTargets[i];
    if (!el) return;
    el.classList.remove('yellow', 'green', 'red');
    if (state !== 'dark') el.classList.add(state);
  },
  getTargetEl(i) { return rbtlTargets[i]; },
  hitRadius(i, rect) {
    return Math.max(22, rect.width / 2 + 12, rect.height / 2 + 12);
  },
};

// ═══════════════════════════════════════════════════════
//  HIT DETECTION — click/tap near yellow light
// ═══════════════════════════════════════════════════════

function handleHitClick(e) {
  if (!isPlaying) return;

  const clickX = e.clientX;
  const clickY = e.clientY;

  let bestIdx    = -1;
  let bestDist   = Infinity;
  let bestRadius = 0;

  const n = activeExercise.targetCount();
  for (let i = 0; i < n; i++) {
    if (lightStates[i] !== 'yellow') continue;
    const el = activeExercise.getTargetEl(i);
    if (!el) continue;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(clickX - cx, clickY - cy);
    if (dist < bestDist) {
      bestDist   = dist;
      bestIdx    = i;
      bestRadius = activeExercise.hitRadius(i, rect);
    }
  }

  if (bestIdx >= 0 && bestDist <= bestRadius) {
    lightHits[bestIdx] = true;
    lightStates[bestIdx] = 'green';
    activeExercise.paint(bestIdx, 'green');
  }
}

  // Debug toggle — reveal page-0 targets at setup (setup preview only).
  document.getElementById('debug-toggle').addEventListener('click', e => {
    rbtlDebug = !rbtlDebug;
    e.currentTarget.textContent = '🐞 DEBUG: ' + (rbtlDebug ? 'ON' : 'OFF');
    e.currentTarget.classList.toggle('active', rbtlDebug);
    if (activeExercise === rbtlExercise && !isPlaying) renderRbtl();
  });

  // RBTL passage dropdown (bundled texts)
  const sel = document.getElementById('text-select');
  RBTL_TEXTS.forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = t.name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => {
    if (isPlaying) return;
    const t = RBTL_TEXTS[+e.target.value];
    if (t) setRbtlText(t.text);
  });

  // RBTL custom file load
  document.getElementById('file-input').addEventListener('change', e => {
    if (isPlaying) return;
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      // add/refresh a "Custom" option and select it
      let custom = sel.querySelector('option[value="custom"]');
      if (!custom) {
        custom = document.createElement('option');
        custom.value = 'custom';
        sel.appendChild(custom);
      }
      custom.textContent = '📄 ' + file.name;
      sel.value = 'custom';
      setRbtlText(String(reader.result));
    };
    reader.readAsText(file);
  });

  // Exercise chooser
  document.getElementById('choose-dots').addEventListener('click', () => selectExercise('dots'));
  document.getElementById('choose-rbtl').addEventListener('click', () => selectExercise('rbtl'));

  // Re-pick RBTL targets on resize (layout-dependent), only when idle.
  let resizeT = null;
  window.addEventListener('resize', () => {
    if (activeExercise !== rbtlExercise || isPlaying) return;
    clearTimeout(resizeT);
    resizeT = setTimeout(renderRbtl, 150);
  });

  // Config buttons
  document.getElementById('btn-play').addEventListener('click', play);
  document.getElementById('btn-stop').addEventListener('click', stop);
  document.getElementById('btn-reset').addEventListener('click', reset);

  // In-play bar buttons
  document.getElementById('pb-toggle').addEventListener('click', () => {
    if (!isPlaying) return;           // ignore once a run has finished (done)
    isPaused ? resumeRun() : pauseRun();
  });
  document.getElementById('pb-reset').addEventListener('click', restartRun);
  document.getElementById('pb-config').addEventListener('click', exitToConfig);

  // Hit detection — click/tap anywhere on the page
  document.addEventListener('pointerdown', handleHitClick);

  // Init state
  setSpeed(2);
  setOffset(0);
  rbtlText    = RBTL_TEXTS[0].text;  // preload first passage (rendered on switch to RBTL)
  activeExercise = dotExercise;
  selectExercise('dots');
  updateReadouts();
});
</script>

</body>
</html>
